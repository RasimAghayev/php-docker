name: TranslateThis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    working-directory: ./app
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup PHP 8.4 (symfony/cache v8 requires PHP >=8.4)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, intl, zip, apcu, opcache
          coverage: none
      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run Tests
        run: composer run-phpunit

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push nginx image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./nginx/Dockerfile
          push: true
          tags: rasimaghayev/php-nginx:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push PHP app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./php/Dockerfile
          target: app
          push: true
          tags: rasimaghayev/php-composer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
